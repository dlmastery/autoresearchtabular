[project]
name = "autoresearchtabular"
version = "0.1.0"
description = "Autonomous ML research loop for Higgs UCI tabular benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "catboost>=1.2",
    "torch>=2.1",
]

[project.optional-dependencies]
neural = ["timm>=1.0", "transformers>=4.40"]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "core.backbones", "core.evaluation", "core.data"]
